name: property_valuer_pro
description: "Property Valuer Pro - Flutter Android Application for Real Estate Valuation and Editable DOCX Report Generation"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  path_provider: ^2.1.2
  intl: ^0.19.0
  file_picker: ^8.0.0
  image_picker: ^1.1.0
  http: ^1.2.1
  flutter_secure_storage: ^9.0.0
  share_plus: ^9.0.0
  open_filex: ^4.4.0
  archive: ^3.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
