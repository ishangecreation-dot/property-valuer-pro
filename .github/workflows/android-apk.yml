name: Build Android APK (Property Valuer Pro)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Test and Release APKs
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 3. Set up Flutter SDK (Stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 4. Verify Flutter Environment
        run: flutter doctor -v

      - name: 5. Install Dependencies
        run: flutter pub get

      - name: 6. Analyze Code Quality
        run: flutter analyze || true

      - name: 7. Run Automated Tests
        run: |
          flutter test --reporter=expanded 2>&1 | tee test_results.log || true

      - name: 7b. Download Gradle Wrapper JAR and Permissions
        run: |
          mkdir -p android/gradle/wrapper
          curl -sLo android/gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.4.0/gradle/wrapper/gradle-wrapper.jar
          test -f android/gradle/wrapper/gradle-wrapper.jar
          echo "Downloaded Gradle wrapper jar: $(stat -c %s android/gradle/wrapper/gradle-wrapper.jar) bytes"
          chmod +x android/gradlew

      - name: 8. Build Debug Test APK (Instant Android Installation)
        run: flutter build apk --debug

      - name: 9. Verify Debug Test APK
        run: |
          ls -la build/app/outputs/flutter-apk/
          test -f build/app/outputs/flutter-apk/app-debug.apk
          echo "Debug APK size: $(stat -c %s build/app/outputs/flutter-apk/app-debug.apk) bytes"

      - name: 10. Upload Debug Test APK Artifact (Property-Valuer-Pro-Test-APK)
        uses: actions/upload-artifact@v4
        with:
          name: Property-Valuer-Pro-Test-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30

      - name: 11. Build Release APK
        run: flutter build apk --release

      - name: 12. Verify Release APK
        run: |
          test -f build/app/outputs/flutter-apk/app-release.apk
          echo "Release APK size: $(stat -c %s build/app/outputs/flutter-apk/app-release.apk) bytes"

      - name: 13. Upload Universal Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Property-Valuer-Pro-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
