name: Build Android APK (Property Valuer Pro)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 3. Set up Flutter SDK (Stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 4. Verify Flutter Environment
        run: flutter doctor -v

      - name: 5. Install Dependencies
        run: flutter pub get

      - name: 6. Analyze Code Quality
        run: flutter analyze --no-fatal-infos

      - name: 7. Run Automated Tests
        run: flutter test

      - name: 8. Build Universal Release APK
        run: flutter build apk --release

      - name: 9. Build ABI-Specific APKs (ARM64, ARM32, x86_64)
        run: flutter build apk --release --split-per-abi

      - name: 10. Verify Output APKs
        run: |
          ls -la build/app/outputs/flutter-apk/
          test -f build/app/outputs/flutter-apk/app-release.apk

      - name: 11. Upload Universal APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PropertyValuerPro-Universal-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: 12. Upload Split ABI APKs Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PropertyValuerPro-Split-ABI-APKs
          path: build/app/outputs/flutter-apk/app-*-release.apk
          retention-days: 30
