name: Build Android APK (Property Valuer Pro)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Test and Release APKs
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 4. Ensure Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.11.1
          chmod +x gradlew

      - name: 5. Build Debug Test APK (Instant Android Installation)
        run: |
          ./gradlew assembleDebug --stacktrace

      - name: 6. Verify and Prepare Debug Test APK
        run: |
          find app/build -name "*.apk" -ls
          DEBUG_APK=$(find app/build -name "*debug*.apk" | head -n 1)
          echo "Found debug APK at: $DEBUG_APK"
          test -f "$DEBUG_APK"
          echo "Debug APK size: $(stat -c %s "$DEBUG_APK") bytes"
          mkdir -p build-artifacts
          cp -f "$DEBUG_APK" build-artifacts/Property-Valuer-Pro-Test.apk

      - name: 7. Upload Debug Test APK Artifact (Property-Valuer-Pro-Test-APK)
        uses: actions/upload-artifact@v4
        with:
          name: Property-Valuer-Pro-Test-APK
          path: build-artifacts/Property-Valuer-Pro-Test.apk
          retention-days: 30

      - name: 8. Build Release APK
        run: |
          ./gradlew assembleRelease --stacktrace

      - name: 9. Verify and Prepare Release APK
        run: |
          find app/build -name "*.apk" -ls
          RELEASE_APK=$(find app/build -name "*release*.apk" | head -n 1)
          echo "Found release APK at: $RELEASE_APK"
          test -f "$RELEASE_APK"
          echo "Release APK size: $(stat -c %s "$RELEASE_APK") bytes"
          mkdir -p build-artifacts
          cp -f "$RELEASE_APK" build-artifacts/Property-Valuer-Pro-Release.apk

      - name: 10. Upload Universal Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Property-Valuer-Pro-Release-APK
          path: build-artifacts/Property-Valuer-Pro-Release.apk
          retention-days: 30
