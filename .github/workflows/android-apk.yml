name: Build Android APK (Property Valuer Pro)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Test and Release APKs
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 3. Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: 4. Verify Flutter Environment
        run: flutter doctor -v

      - name: 5. Install Dependencies
        run: flutter pub get

      - name: 6. Analyze Code Quality
        run: flutter analyze || true

      - name: 7. Run Automated Tests
        run: |
          flutter test --reporter=expanded 2>&1 | tee test_results.log || true

      - name: 7b. Download Gradle Wrapper JAR and Permissions
        run: |
          mkdir -p android/gradle/wrapper
          curl -sLo android/gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.4.0/gradle/wrapper/gradle-wrapper.jar
          test -f android/gradle/wrapper/gradle-wrapper.jar
          echo "Downloaded Gradle wrapper jar: $(stat -c %s android/gradle/wrapper/gradle-wrapper.jar) bytes"
          chmod +x android/gradlew

      - name: 8. Build Debug Test APK (Instant Android Installation)
        run: |
          flutter build apk --debug -v > flutter_debug_build.log 2>&1 || {
            BUILD_STATUS=$?
            echo "::error::Flutter debug build failed with code $BUILD_STATUS"
            echo "================ LAST 250 LINES OF BUILD LOG ================"
            tail -n 250 flutter_debug_build.log
            echo "============================================================="
            exit $BUILD_STATUS
          }

      - name: Record Build Failure Log to Branch
        if: failure()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B build-error-log
          tail -n 600 flutter_debug_build.log > last_build_error.txt
          git add last_build_error.txt
          git commit -m "ci: capture build error log [skip ci]" || true
          git push -f origin build-error-log || true

      - name: 9. Verify and Prepare Debug Test APK
        run: |
          find build -name "*.apk" -ls
          DEBUG_APK=$(find build -name "*debug*.apk" -o -name "app-*.apk" | head -n 1)
          echo "Found debug APK at: $DEBUG_APK"
          test -f "$DEBUG_APK"
          echo "Debug APK size: $(stat -c %s "$DEBUG_APK") bytes"
          mkdir -p build/app/outputs/flutter-apk
          cp "$DEBUG_APK" build/app/outputs/flutter-apk/app-debug.apk

      - name: 10. Upload Debug Test APK Artifact (Property-Valuer-Pro-Test-APK)
        uses: actions/upload-artifact@v4
        with:
          name: Property-Valuer-Pro-Test-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30

      - name: 11. Build Release APK
        run: |
          flutter build apk --release -v > flutter_release_build.log 2>&1 || {
            BUILD_STATUS=$?
            echo "::error::Flutter release build failed with code $BUILD_STATUS"
            echo "================ LAST 250 LINES OF RELEASE BUILD LOG ================"
            tail -n 250 flutter_release_build.log
            echo "============================================================="
            exit $BUILD_STATUS
          }

      - name: 12. Verify and Prepare Release APK
        run: |
          find build -name "*.apk" -ls
          RELEASE_APK=$(find build -name "*release*.apk" | head -n 1)
          echo "Found release APK at: $RELEASE_APK"
          test -f "$RELEASE_APK"
          echo "Release APK size: $(stat -c %s "$RELEASE_APK") bytes"
          mkdir -p build/app/outputs/flutter-apk
          cp "$RELEASE_APK" build/app/outputs/flutter-apk/app-release.apk

      - name: 13. Upload Universal Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Property-Valuer-Pro-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
